<!DOCTYPE html>
<html lang="ru">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Samsung Galaxy — Контакты
  </title>
  <link href="css/style.css" rel="stylesheet"/>
  <link href="css/dark.css" rel="stylesheet"/>
 </head>
 <body data-page="contact">
  <div id="siteHeader"></div>
  <main>
   <section class="page-hero">
    <span class="eyebrow">
     Обратная связь
    </span>
    <h1>
     Контакты
    </h1>
    <p>
     Форма является демонстрационной частью учебного проекта.
    </p>
   </section>
   <section class="section contact-layout">
    <div class="contact-info">
     <h2>
      Есть вопрос?
     </h2>
     <p>
      Напиши нам, какую модель или функцию стоит добавить в каталог.
     </p>
     <div class="contact-item">
      <strong>
       Автор
      </strong>
      <span>
       Moroz Stanislav
      </span>
     </div>
     <div class="contact-item">
      <strong>
       Группа
      </strong>
      <span>
       IT11Z
      </span>
     </div>
     <div class="contact-item">
      <strong>
       Проект
      </strong>
      <span>
       Web Programming I
      </span>
     </div>
    </div>
    <form class="contact-form" id="contactForm">
     <label>
      Имя
      <input id="name" minlength="2" name="name" placeholder="Ваше имя" required=""/>
     </label>
     <label>
      Email
      <input id="email" name="email" placeholder="name@example.com" required="" type="email"/>
     </label>
     <label>
      Сообщение
      <textarea id="message" minlength="10" name="message" placeholder="Ваше сообщение..." required="" rows="6"></textarea>
     </label>
     <button class="btn btn-light" type="submit">
      Отправить
     </button>
     <p aria-live="polite" class="form-message" id="formMessage">
     </p>
    </form>
   </section>
  </main>
  <div id="siteFooter"></div>
  <script src="js/layout.js"></script>
  <script src="js/script.js">
  </script>
   <script src="js/interactive.js"></script>
 </body>
</html>
