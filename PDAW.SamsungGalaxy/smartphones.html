<!DOCTYPE html>
<html lang="ru">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Samsung Galaxy — Смартфоны
  </title>
  <link href="css/style.css" rel="stylesheet"/>
  <link href="css/dark.css" rel="stylesheet"/>
 </head>
 <body data-page="smartphones">
  <div id="siteHeader"></div>
  <main>
   <section class="page-hero catalog-hero">
    <span class="eyebrow">
     25 МОДЕЛЕЙ · S / Z / A
    </span>
    <h1>
     Смартфоны Galaxy
    </h1>
    <p>
     Реальные изображения без лишнего фона, расширенные характеристики, поиск, фильтры, избранное и сравнение.
    </p>
    <div class="catalog-pills">
     <span>
      Galaxy S
     </span>
     <span>
      Galaxy Z
     </span>
     <span>
      Galaxy A
     </span>
    </div>
   </section>
   <section class="section catalog-section">
    <div class="toolbar">
     <input aria-label="Поиск" id="searchInput" placeholder="Поиск модели, например S26 Ultra..." type="search"/>
     <select id="seriesFilter">
      <option value="all">
       Все серии
      </option>
      <option value="S">
       Galaxy S
      </option>
      <option value="A">
       Galaxy A
      </option>
      <option value="Z">
       Galaxy Z
      </option>
     </select>
     <select id="sortFilter">
      <option value="default">
       По умолчанию
      </option>
      <option value="name">
       По названию
      </option>
      <option value="screen">
       По размеру экрана
      </option>
      <option value="series">
       По серии
      </option>
     </select>
    </div>
    <p class="result-count" id="resultCount">
    </p>
    <div class="phone-grid" id="phoneGrid">
    </div>
   </section>
  </main>
  <div aria-hidden="true" class="modal" id="phoneModal">
   <div class="modal-box">
    <button class="modal-close" type="button">
     ×
    </button>
    <div id="modalContent">
    </div>
   </div>
  </div>
  <div id="siteFooter"></div>
  <script src="js/layout.js"></script>
  <script src="js/script.js">
  </script>
  <script src="js/phones.js">
  </script>
   <script src="js/interactive.js"></script>
 </body>
</html>
